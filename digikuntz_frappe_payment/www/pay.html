<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirection en cours...</title>
    <style>
        body { margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f6f8fb; font-family: Arial, sans-serif; }
        .box { text-align: center; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 400px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: #4CAF50; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #dc3545; }
    </style>
</head>
<body>
<div class="box">
    {% if redirect_url %}
        <div class="spinner"></div>
        <p>Redirection vers la page de paiement...</p>
        <script>
            window.location.href = {{ redirect_url | tojson }};
        </script>
    {% else %}
        <div class="error">
            <p style="font-size:40px">✖</p>
            <h3>Lien invalide</h3>
            <p>{{ error }}</p>
        </div>
    {% endif %}
</div>
</body>
</html>
